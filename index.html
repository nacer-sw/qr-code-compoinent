<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | QR code component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      body {
        font-family: url("https://fonts.google.com/specimen/Outfit");
        background-color: hsl(212, 45%, 89%);
        padding: 10%;
        background-attachment: fixed;
      }
      .qr {
        background-color: white;
        border-radius: 5%;
        /* padding-top: 10px;
        padding-bottom: 20px; */
        width: 250px;
        height: 375px;
        text-align: center;
        margin: auto;
        margin-top: -7%;
        background-attachment: fixed;
      }
      .qr img {
        margin: 4% 4%;
        border-radius: 5%;
        width: 90%;
      }
      .prompt {
        display: inline-block;
        font-size: 15px;
        font-weight: bolder;
        margin-top: -0.5%;
        padding-top: 2%;
      }
      .qr_prompt {
        font-size: 11px;
        color: grey;
        margin-top: -2%;
      }
      .attribution {
        font-size: 11px;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div class="qr">
      <img src="images/image-qr-code.png" alt="qr code picture" width="200px" />

      <p class="prompt">
        Improve your front-end <br />skills by building projects
      </p>
      <p class="qr_prompt">
        scan the QR code to visit Frontend <br />Mentor and take your coding
        skills to<br />
        the next level
      </p>
    </div>
    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">Your Name Here</a>.
    </div>
  </body>
</html>
